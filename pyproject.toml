[project]
name = "detective-whiteboard"
version = "0.1.0"
description = "A browser-based detective whiteboard for linking cards, pictures and notes"
readme = "README.md"
authors = [
    { name = "sunlu", email = "sunlu.electric@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "python-dotenv>=1.2.4",
]

[project.scripts]
detective-whiteboard = "detective_whiteboard:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
