<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Detective Whiteboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header id="toolbar">
    <button id="btn-create">Create</button>
    <button id="btn-load">Load</button>
    <button id="btn-save" data-needs-board>Save</button>
    <button id="btn-rename" data-needs-board>Rename</button>
    <span class="sep"></span>
    <button id="btn-add-card" data-needs-board>Create Card</button>
    <span class="sep"></span>
    <button id="btn-zoom-out" data-needs-board title="Zoom out">-</button>
    <button id="btn-zoom-reset" data-needs-board title="Reset zoom">100%</button>
    <button id="btn-zoom-in" data-needs-board title="Zoom in">+</button>
    <span id="board-name"></span>
    <span id="status"></span>
    <input id="file-load" type="file" accept=".json,application/json" hidden>
    <input id="file-picture" type="file" accept="image/png,image/jpeg" hidden>
  </header>
  <main id="viewport">
    <div id="content">
      <svg id="links"></svg>
      <div id="cards"></div>
    </div>
    <div id="empty-hint">Create or load a whiteboard to begin.</div>
  </main>
  <div id="side">
    <div id="search">
      <div class="search-head">
        <span id="search-tabs">
          <button data-mode="global" class="active">Global</button>
          <button data-mode="card">Card</button>
          <button data-mode="property">Property</button>
        </span>
        <span id="search-count"></span>
        <button id="search-toggle" class="icon" title="Minimize search">&minus;</button>
      </div>
      <div class="search-fields">
        <input id="search-input" type="search" placeholder="Keyword (* and ? wildcards)" autocomplete="off" data-needs-board>
        <input id="search-tag" type="search" placeholder="Tag (exact)" autocomplete="off" data-needs-board hidden>
        <input id="search-content" type="search" placeholder="Content (* and ? wildcards)" autocomplete="off" data-needs-board hidden>
      </div>
    </div>
    <div id="link-panel" hidden>
      <div class="row"><span>Color</span><span id="link-colors"></span></div>
      <div class="row"><span>Style</span>
        <select id="link-style">
          <option value="solid">Solid</option>
          <option value="dashed">Dashed</option>
          <option value="dotted">Dotted</option>
        </select>
      </div>
      <div class="row"><span>Direction</span>
        <select id="link-direction">
          <option value="forward">A to B</option>
          <option value="backward">B to A</option>
          <option value="none">Undirected</option>
        </select>
      </div>
      <div class="row"><span>Message</span>
        <input id="link-message" placeholder="Shown on the line" autocomplete="off">
      </div>
      <div class="row"><button id="link-delete">Delete link</button></div>
    </div>
  </div>
  <div id="chat">
    <div class="chat-head">
      <span>Assistant</span>
      <select id="chat-model" title="Model"></select>
      <button id="chat-clear" class="icon" title="Clear the chat history">Clear</button>
      <button id="chat-toggle" class="icon" title="Minimize assistant">&minus;</button>
    </div>
    <div id="chat-messages"></div>
    <form id="chat-form">
      <textarea id="chat-input" rows="3" placeholder="Ask the assistant (Enter to send, Shift+Enter for a new line)"></textarea>
      <button id="chat-send">Send</button>
    </form>
  </div>
  <dialog id="dialog">
    <form method="dialog">
      <h3 id="dialog-title"></h3>
      <p id="dialog-message"></p>
      <div id="dialog-fields"></div>
      <div class="dialog-buttons">
        <button id="dialog-ok" value="ok"></button>
        <button id="dialog-cancel" value="cancel" formnovalidate></button>
      </div>
    </form>
  </dialog>
  <script src="ops.js"></script>
  <script src="assistant.js"></script>
  <script src="app.js"></script>
</body>
</html>
